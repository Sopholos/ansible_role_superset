---
dist: jammy
language: python
python: "3.11"
os: linux
services:
  - docker
install:
  - pip install pipenv
  - pipenv sync
env:
  jobs:
    - MOLECULE_DISTRO=debian:12
script:
  - export MOLECULE_DISTRO=${MOLECULE_DISTRO}
  - pipenv run molecule test

notifications:
  webhooks: https://galaxy.ansible.com/api/v1/notifications/